; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file, time
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_speed = 921600

; Используем partition table для 4MB Flash (больше места для прошивки)
board_build.partitions = huge_app.csv

; ============================================================================
; TFT_eSPI configuration for ILI9486
; ============================================================================
build_flags =
    -D USER_SETUP_LOADED=1
    -D RPI_ILI9486_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D SPI_FREQUENCY=20000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    ; Отключены неиспользуемые шрифты для экономии flash (экономия ~15-20 KB)
    ; -D LOAD_FONT4=1
    ; -D LOAD_FONT6=1
    ; -D LOAD_FONT7=1
    ; -D LOAD_FONT8=1
    ; -D LOAD_GFXFF=1
    ; -D SMOOTH_FONT=1

; ============================================================================
; Логирование через последовательный порт
; ============================================================================
; Уровни логирования: 0=NONE, 1=ERROR, 2=WARNING, 3=INFO, 4=DEBUG
; Глобальный уровень (по умолчанию INFO)
    -D GLOBAL_LOG_LEVEL=3

; Включение/отключение компонентов (1=включено, 0=выключено)
    -D LOG_SENSORS=1
    -D LOG_WIFI=1
    -D LOG_SD=1
    -D LOG_DISPLAY=1
    -D LOG_WEBSERVER=1
    -D LOG_NETWORK=1
    -D LOG_TASKS=1
    -D LOG_SETTINGS=1
    -D LOG_INA226=1
    -D LOG_MICROPHONE=1
    -D LOG_SCD4X=1
    -D LOG_PMS=1
    -D LOG_BH1750=1
    -D LOG_MS5611=1
    -D LOG_VEML=1
    -D LOG_BME=1
    -D LOG_HTU=1
    -D LOG_CH2O=1
    -D LOG_WEBSOCKET=1
    -D LOG_NTP=1
    -D LOG_SEND_DATA=1

; Индивидуальные уровни логирования для компонентов (по умолчанию = GLOBAL_LOG_LEVEL)
    -D SENSORS_LOG_LEVEL=3
    -D WIFI_LOG_LEVEL=3
    -D SD_LOG_LEVEL=3
    -D DISPLAY_LOG_LEVEL=2
    -D WEBSERVER_LOG_LEVEL=3
    -D NETWORK_LOG_LEVEL=3
    -D TASKS_LOG_LEVEL=3
    -D SETTINGS_LOG_LEVEL=3
    -D INA226_LOG_LEVEL=3
    -D MICROPHONE_LOG_LEVEL=3
    -D SCD4X_LOG_LEVEL=4
    -D PMS_LOG_LEVEL=3
    -D BH1750_LOG_LEVEL=3
    -D MS5611_LOG_LEVEL=3
    -D VEML_LOG_LEVEL=3
    -D BME_LOG_LEVEL=3
    -D HTU_LOG_LEVEL=3
    -D CH2O_LOG_LEVEL=3
    -D WEBSOCKET_LOG_LEVEL=3
    -D NTP_LOG_LEVEL=3
    -D SEND_DATA_LOG_LEVEL=3

lib_deps =
	bodmer/TFT_eSPI @ ^2.5.43
	bodmer/TFT_eWidget@^0.0.6
	adafruit/Adafruit BME280 Library@^2.2.4
	avaldebe/PMSerial@^1.2.0
	adafruit/Adafruit HTU21DF Library@^1.1.2
	adafruit/Adafruit BusIO@^1.15.0
	claws/BH1750@^1.3.0
	links2004/WebSockets@^2.4.1
	bblanchon/ArduinoJson@^7.0.4
	https://github.com/me-no-dev/AsyncTCP
	https://github.com/me-no-dev/ESPAsyncWebServer
	adafruit/Adafruit VEML6070 Library@^1.0.8
	https://github.com/jarzebski/Arduino-MS5611
	robtillaart/INA226@^0.6.0
	https://github.com/meshtastic/esp32_https_server
;sensirion/Sensirion I2C SCD4x@^1.1.0
