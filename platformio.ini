; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
monitor_speed = 115200
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_speed = 921600

; TFT_eSPI configuration for ILI9486
build_flags = 
    -D USER_SETUP_LOADED=1
    -D RPI_ILI9486_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D SPI_FREQUENCY=20000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

lib_deps =
	bodmer/TFT_eSPI @ ^2.5.43
	bodmer/TFT_eSPI @ ~2.5.43
	bodmer/TFT_eSPI @ 2.5.43
	bodmer/TFT_eWidget@^0.0.6
	adafruit/Adafruit BME280 Library@^2.2.4
	avaldebe/PMSerial@^1.2.0
	adafruit/Adafruit HTU21DF Library@^1.1.2
	adafruit/Adafruit BusIO@^1.15.0
	claws/BH1750@^1.3.0
	links2004/WebSockets@^2.4.1
	bblanchon/ArduinoJson@^7.0.4
	https://github.com/me-no-dev/AsyncTCP
	https://github.com/me-no-dev/ESPAsyncWebServer
	adafruit/Adafruit VEML6070 Library@^1.0.8
	https://github.com/jarzebski/Arduino-MS5611
	robtillaart/INA226@^0.6.0
;sensirion/Sensirion I2C SCD4x@^1.1.0
